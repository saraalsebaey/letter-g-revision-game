<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capital G & Small g Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF9A8B;
            --secondary: #FF6A88;
            --accent: #FF99AC;
            --bg-color: #f0f9ff;
            --success: #a7f3d0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .font-letter {
            font-family: 'Comic Neue', cursive; /* Ensures single-storey lowercase 'g' */
        }

        /* Animations */
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseSoft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-bounce-in { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-pulse-soft { animation: pulseSoft 2s infinite; }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pop { animation: pop 0.4s forwards; }
        .animate-slide-up { animation: slideInUp 0.5s forwards; }

        /* UI Elements */
        .game-btn {
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 100%);
            box-shadow: 0 6px 0 #d94a68, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        .game-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #d94a68, 0 4px 6px rgba(0,0,0,0.1);
        }

        .letter-card {
            background: white;
            border: 4px solid #bae6fd;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .letter-card.target-found {
            background-color: var(--success);
            border-color: #34d399;
            pointer-events: none;
            animation: bounceIn 0.4s;
        }

        .draggable {
            touch-action: none;
            cursor: grab;
            z-index: 10;
        }
        .draggable:active {
            cursor: grabbing;
        }
        
        .drop-zone {
            transition: transform 0.2s;
        }
        .drop-zone.active {
            transform: scale(1.1);
            border-color: #34d399;
            background-color: #ecfdf5;
        }

        /* Overlay */
        #feedback-overlay {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: none;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #facc15;
            animation: confetti-fall 3s linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen text-slate-800">

    <!-- Top Bar / Progress -->
    <header class="w-full p-4 flex justify-between items-center bg-white/80 shadow-sm z-20 absolute top-0 left-0">
        <h1 class="text-xl md:text-2xl font-black text-sky-500 drop-shadow-sm flex items-center gap-2">
            <svg class="w-8 h-8 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
            <span id="level-title">G & g Adventure</span>
        </h1>
        <div class="flex gap-1" id="progress-dots">
            <!-- Filled dynamically -->
        </div>
    </header>

    <!-- Main Game Container -->
    <main id="game-board" class="flex-1 w-full h-full relative pt-20 pb-4 px-4 flex justify-center items-center">
        <!-- Scenes are injected here by JavaScript -->
    </main>

    <!-- Global Next Button -->
    <div id="next-btn-container" class="absolute bottom-6 right-6 hidden z-30">
        <button onclick="nextLevel()" class="game-btn text-white font-bold text-xl py-3 px-8 rounded-full flex items-center gap-2 animate-bounce-in">
            Next <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
        </button>
    </div>

    <!-- Feedback Overlay -->
    <div id="feedback-overlay" class="absolute inset-0 flex flex-col items-center justify-center">
        <div id="feedback-star" class="w-40 h-40 text-yellow-400 animate-bounce-in drop-shadow-xl">
            <svg fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
        </div>
        <h2 id="feedback-text" class="text-4xl md:text-6xl font-black text-pink-500 mt-4 animate-slide-up text-center px-4 drop-shadow-md">Great Job!</h2>
    </div>

    <script>
        // --- Web Audio Context for simple sound effects ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(frequency, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            pop: () => playTone(600, 'sine', 0.15, 0.1),
            success: () => { playTone(523.25, 'sine', 0.1); setTimeout(() => playTone(659.25, 'sine', 0.2), 100); },
            error: () => playTone(250, 'triangle', 0.2, 0.05),
            tada: () => {
                playTone(440, 'square', 0.1);
                setTimeout(() => playTone(554, 'square', 0.1), 100);
                setTimeout(() => playTone(659, 'square', 0.4), 200);
            }
        };

        // --- Speech Synthesis ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1.2; // slightly higher pitch for kids
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Game State & Data ---
        let currentLevelIndex = 0;
        let levelState = {};

        const levels = [
            { id: 'intro', title: 'Welcome!' },
            { id: 'meet', title: 'Meet the Letters' },
            { id: 'find-G', title: 'Find Capital G' },
            { id: 'find-g', title: 'Find Small g' },
            { id: 'match', title: 'Match the Letters' },
            { id: 'sort', title: 'Sort the Letters' },
            { id: 'challenge', title: 'Final Challenge' },
            { id: 'outro', title: 'Superstar!' }
        ];

        // --- Core UI Functions ---
        const board = document.getElementById('game-board');
        const nextBtn = document.getElementById('next-btn-container');
        const levelTitle = document.getElementById('level-title');

        function updateProgress() {
            const container = document.getElementById('progress-dots');
            container.innerHTML = '';
            for(let i=1; i<levels.length-1; i++) {
                const dot = document.createElement('div');
                dot.className = `w-3 h-3 md:w-4 md:h-4 rounded-full ${i <= currentLevelIndex ? 'bg-green-400' : 'bg-slate-200'}`;
                container.appendChild(dot);
            }
        }

        function showNextButton() {
            nextBtn.classList.remove('hidden');
            setTimeout(() => { sounds.success(); }, 300);
        }

        function hideNextButton() {
            nextBtn.classList.add('hidden');
        }

        function showFeedback(message) {
            const overlay = document.getElementById('feedback-overlay');
            const text = document.getElementById('feedback-text');
            text.textContent = message;
            overlay.style.display = 'flex';
            sounds.tada();
            speak(message);
            
            // Create some confetti
            for(let i=0; i<20; i++){
                createConfetti(overlay);
            }

            setTimeout(() => {
                overlay.style.display = 'none';
                showNextButton();
            }, 2500);
        }

        function createConfetti(container) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.backgroundColor = ['#facc15', '#f472b6', '#60a5fa', '#34d399'][Math.floor(Math.random()*4)];
            conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
            container.appendChild(conf);
            setTimeout(() => conf.remove(), 4000);
        }

        // --- Drag and Drop Helper (Touch & Mouse) ---
        // A robust custom drag system that works on mobile and desktop
        let dragItem = null;
        let dragStartX, dragStartY, initialLeft, initialTop;
        
        function makeDraggable(el, onDropCallback) {
            el.classList.add('draggable');
            
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                dragItem = el;
                const rect = el.getBoundingClientRect();
                
                // Switch to absolute positioning for dragging
                if(el.style.position !== 'absolute') {
                     el.style.position = 'absolute';
                     el.style.left = rect.left + 'px';
                     el.style.top = rect.top + 'px';
                     el.style.margin = '0';
                }

                dragStartX = e.clientX;
                dragStartY = e.clientY;
                initialLeft = parseFloat(el.style.left) || rect.left;
                initialTop = parseFloat(el.style.top) || rect.top;
                
                el.style.zIndex = 1000;
                el.style.transform = 'scale(1.1)';
                el.setPointerCapture(e.pointerId);
                sounds.pop();
            });

            el.addEventListener('pointermove', (e) => {
                if(dragItem !== el) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                el.style.left = (initialLeft + dx) + 'px';
                el.style.top = (initialTop + dy) + 'px';
            });

            el.addEventListener('pointerup', (e) => {
                if(dragItem !== el) return;
                dragItem = null;
                el.style.zIndex = 10;
                el.style.transform = 'scale(1)';
                el.releasePointerCapture(e.pointerId);

                // Temporarily hide item to find what's underneath
                el.style.display = 'none';
                const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
                el.style.display = 'flex'; // Restore

                let handled = false;
                if(dropTarget) {
                    // Find closest drop-zone
                    const zone = dropTarget.closest('.drop-zone');
                    if(zone) {
                        handled = onDropCallback(el, zone);
                    }
                }

                if(!handled) {
                    // Snap back
                    sounds.error();
                    el.style.transition = 'all 0.3s ease';
                    el.style.left = initialLeft + 'px';
                    el.style.top = initialTop + 'px';
                    setTimeout(() => { el.style.transition = ''; }, 300);
                }
            });
        }

        // --- Level Renderers ---

        function renderIntro() {
            board.innerHTML = `
                <div class="text-center animate-bounce-in flex flex-col items-center">
                    <div class="flex gap-4 mb-8">
                        <div class="w-32 h-32 md:w-48 md:h-48 bg-white rounded-3xl shadow-xl border-8 border-sky-300 flex items-center justify-center text-7xl md:text-9xl text-sky-500 font-letter animate-float">G</div>
                        <div class="w-32 h-32 md:w-48 md:h-48 bg-white rounded-3xl shadow-xl border-8 border-pink-300 flex items-center justify-center text-7xl md:text-9xl text-pink-500 font-letter animate-float" style="animation-delay: 0.5s">g</div>
                    </div>
                    <h2 class="text-3xl md:text-5xl font-black text-slate-700 mb-8 max-w-lg">Capital G & Small g Adventure!</h2>
                    <button onclick="nextLevel()" class="game-btn text-white font-bold text-3xl py-4 px-12 rounded-full animate-pulse-soft">
                        Play Now!
                    </button>
                </div>
            `;
            setTimeout(() => speak("Welcome to Capital G and Small g adventure! Let's play!"), 500);
        }

        function renderMeet() {
            levelState = { clickedG: false, clickedg: false };
            board.innerHTML = `
                <div class="flex flex-col items-center w-full max-w-3xl">
                    <h2 class="text-2xl md:text-4xl font-bold text-sky-600 mb-8 text-center bg-white px-6 py-3 rounded-full shadow-sm">Tap each letter to hear its name!</h2>
                    <div class="flex flex-col md:flex-row gap-8 w-full justify-center px-4">
                        <div id="meet-G" class="letter-card w-40 h-56 md:w-56 md:h-72 text-8xl md:text-[120px] font-letter text-sky-500 animate-slide-up" style="border-color: #7dd3fc; border-width: 8px;">
                            G
                        </div>
                        <div id="meet-g" class="letter-card w-40 h-56 md:w-56 md:h-72 text-8xl md:text-[120px] font-letter text-pink-500 animate-slide-up" style="animation-delay: 0.2s; border-color: #f9a8d4; border-width: 8px;">
                            g
                        </div>
                    </div>
                </div>
            `;
            
            speak("Tap each letter to hear its name!");

            document.getElementById('meet-G').onclick = function() {
                sounds.pop();
                speak("Capital G");
                this.classList.add('bg-sky-50', 'scale-105');
                levelState.clickedG = true;
                checkMeetComplete();
            };

            document.getElementById('meet-g').onclick = function() {
                sounds.pop();
                speak("Small g");
                this.classList.add('bg-pink-50', 'scale-105');
                levelState.clickedg = true;
                checkMeetComplete();
            };

            function checkMeetComplete() {
                if(levelState.clickedG && levelState.clickedg && !levelState.done) {
                    levelState.done = true;
                    setTimeout(() => showNextButton(), 1000);
                }
            }
        }

        function generateGridGame(targetLetter, isCapital) {
            const allCaps = ['A','B','C','D','E','F','H','J','O','Q','C'];
            const allSmall = ['a','b','c','d','e','f','h','j','o','q','c'];
            const distractors = isCapital ? allCaps : allSmall;
            const titleText = isCapital ? "Capital G" : "Small g";
            const targetColor = isCapital ? "text-sky-600" : "text-pink-600";
            
            levelState = { found: 0, required: 4, done: false };
            
            let gridItems = [targetLetter, targetLetter, targetLetter, targetLetter];
            while(gridItems.length < 12) {
                gridItems.push(distractors[Math.floor(Math.random() * distractors.length)]);
            }
            gridItems.sort(() => Math.random() - 0.5);

            board.innerHTML = `
                <div class="flex flex-col items-center w-full max-w-4xl h-full pb-16">
                    <h2 class="text-2xl md:text-4xl font-bold text-slate-700 mb-6 text-center bg-white px-6 py-3 rounded-full shadow-sm">
                        Find all <span class="${targetColor} font-letter text-4xl">${targetLetter}</span> !
                    </h2>
                    <div class="grid grid-cols-3 md:grid-cols-4 gap-4 w-full px-4">
                        ${gridItems.map((letter, i) => `
                            <div class="grid-letter letter-card aspect-square text-6xl md:text-7xl font-letter text-slate-700 animate-slide-up" 
                                 style="animation-delay: ${i*0.05}s"
                                 data-letter="${letter}">
                                ${letter}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            speak(`Find all ${titleText}`);

            document.querySelectorAll('.grid-letter').forEach(el => {
                el.onclick = function() {
                    if(this.classList.contains('target-found')) return;

                    const l = this.getAttribute('data-letter');
                    if(l === targetLetter) {
                        sounds.pop();
                        this.classList.add('target-found');
                        this.innerHTML = `${l}<div class="absolute inset-0 flex items-center justify-center"><svg class="w-16 h-16 text-yellow-400 opacity-50" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg></div>`;
                        speak(titleText);
                        levelState.found++;
                        if(levelState.found >= levelState.required && !levelState.done) {
                            levelState.done = true;
                            setTimeout(() => showFeedback("Amazing!"), 800);
                        }
                    } else {
                        sounds.error();
                        this.classList.remove('animate-shake');
                        void this.offsetWidth; // trigger reflow
                        this.classList.add('animate-shake');
                        speak("Try again! Find " + titleText);
                    }
                };
            });
        }

        function renderMatch() {
            levelState = { matches: 0, required: 7, done: false };
            
            // All letters from A to G
            const pairs = [
                { cap: 'A', small: 'a', border: '#f87171', text: '#ef4444' }, // red
                { cap: 'B', small: 'b', border: '#60a5fa', text: '#3b82f6' }, // blue
                { cap: 'C', small: 'c', border: '#4ade80', text: '#22c55e' }, // green
                { cap: 'D', small: 'd', border: '#c084fc', text: '#a855f7' }, // purple
                { cap: 'E', small: 'e', border: '#fb923c', text: '#f97316' }, // orange
                { cap: 'F', small: 'f', border: '#2dd4bf', text: '#14b8a6' }, // teal
                { cap: 'G', small: 'g', border: '#f472b6', text: '#ec4899' }  // pink
            ];

            // Shuffle both arrays independently
            const caps = [...pairs].sort(() => Math.random() - 0.5);
            const smalls = [...pairs].sort(() => Math.random() - 0.5);

            board.innerHTML = `
                <div class="flex flex-col items-center w-full h-full relative max-w-4xl pb-2">
                    <h2 class="text-xl md:text-3xl font-bold text-slate-700 mb-2 text-center bg-white px-6 py-2 rounded-full shadow-sm z-10">
                        Match Letters <span class="font-letter text-sky-600">A</span> to <span class="font-letter text-pink-600">G</span>
                    </h2>
                    
                    <div class="flex justify-between w-full h-full px-6 md:px-20 pt-2 relative">
                        <!-- Left side: Draggables -->
                        <div class="flex flex-col gap-2 md:gap-3 w-14 md:w-24 items-center" id="match-left">
                            ${caps.map(p => `
                                <div class="letter-card w-12 h-12 md:w-16 md:h-16 text-3xl md:text-4xl font-letter bg-white shadow-md border-2 drag-source" 
                                     data-pair="${p.cap}" 
                                     style="border-color: ${p.border}; color: ${p.text}; position:relative;">${p.cap}</div>
                            `).join('')}
                        </div>

                        <!-- Right side: Drop Targets -->
                        <div class="flex flex-col gap-2 md:gap-3 w-14 md:w-24 items-center" id="match-right">
                            ${smalls.map(p => `
                                <div class="letter-card w-12 h-12 md:w-16 md:h-16 text-3xl md:text-4xl font-letter bg-slate-50 border-2 border-dashed drop-zone" 
                                     data-target="${p.cap}"
                                     style="border-color: ${p.border}; color: ${p.text};">${p.small}</div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            speak("Drag the capital letter to its small letter.");

            const draggables = document.querySelectorAll('.drag-source');
            draggables.forEach(el => {
                makeDraggable(el, (draggedEl, dropZone) => {
                    const pairId = draggedEl.getAttribute('data-pair');
                    const targetId = dropZone.getAttribute('data-target');
                    
                    if(pairId === targetId) {
                        // Success Match
                        sounds.success();
                        
                        // Visual merge
                        dropZone.style.borderStyle = 'solid';
                        dropZone.style.backgroundColor = '#ecfdf5'; // light green
                        dropZone.style.borderColor = '#34d399'; // green border
                        dropZone.style.color = '#059669'; // green text
                        
                        // Combine text
                        dropZone.innerHTML = `<span class="text-xl md:text-3xl font-bold flex gap-1 items-center"><span>${draggedEl.innerHTML}</span><span>${dropZone.innerHTML}</span></span>`;
                        
                        // Hide original draggable
                        draggedEl.style.display = 'none';

                        levelState.matches++;
                        if(levelState.matches >= levelState.required && !levelState.done) {
                            levelState.done = true;
                            setTimeout(() => showFeedback("Perfect Matching!"), 1000);
                        }
                        return true;
                    } else {
                        sounds.error();
                        speak("Try again!");
                        return false;
                    }
                });
            });
        }

        function renderSort() {
            levelState = { sorted: 0, required: 6, done: false };
            let letters = ['G', 'g', 'g', 'G', 'G', 'g'];
            letters.sort(() => Math.random() - 0.5);

            board.innerHTML = `
                <div class="flex flex-col items-center w-full h-full relative max-w-4xl pb-4">
                    <h2 class="text-2xl md:text-4xl font-bold text-slate-700 mb-4 text-center bg-white px-6 py-3 rounded-full shadow-sm z-10">
                        Sort into the correct baskets!
                    </h2>
                    
                    <!-- Scattered Letters -->
                    <div class="flex-1 w-full relative" id="scatter-area">
                        ${letters.map((l, i) => `
                            <div class="letter-card drag-letter w-20 h-20 md:w-24 md:h-24 text-5xl md:text-6xl font-letter absolute shadow-md border-4 border-slate-200"
                                 data-letter="${l}"
                                 style="left: ${10 + (i*15) + (Math.random()*5)}%; top: ${5 + (Math.random()*15)}%; transform: rotate(${(Math.random()-0.5)*30}deg)">
                                ${l}
                            </div>
                        `).join('')}
                    </div>

                    <!-- Baskets -->
                    <div class="w-full flex justify-around mt-auto pt-8">
                        <div class="flex flex-col items-center drop-zone" data-basket="G">
                            <div class="w-32 h-24 md:w-48 md:h-32 bg-sky-200 border-4 border-sky-400 rounded-b-3xl rounded-t-lg relative flex items-end justify-center pb-2 shadow-inner overflow-hidden basket-container">
                                <!-- Decorative lines for basket -->
                                <div class="absolute inset-0 opacity-20 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,#000_10px,#000_20px)]"></div>
                            </div>
                            <div class="mt-4 bg-sky-500 text-white font-bold text-2xl md:text-4xl py-2 px-6 rounded-full font-letter shadow-md">Capital G</div>
                        </div>

                        <div class="flex flex-col items-center drop-zone" data-basket="g">
                            <div class="w-32 h-24 md:w-48 md:h-32 bg-pink-200 border-4 border-pink-400 rounded-b-3xl rounded-t-lg relative flex items-end justify-center pb-2 shadow-inner overflow-hidden basket-container">
                                 <div class="absolute inset-0 opacity-20 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,#000_10px,#000_20px)]"></div>
                            </div>
                            <div class="mt-4 bg-pink-500 text-white font-bold text-2xl md:text-4xl py-2 px-6 rounded-full font-letter shadow-md">Small g</div>
                        </div>
                    </div>
                </div>
            `;

            speak("Sort the letters into the Capital G and Small g baskets.");

            document.querySelectorAll('.drag-letter').forEach(el => {
                makeDraggable(el, (draggedEl, dropZone) => {
                    const letter = draggedEl.getAttribute('data-letter');
                    const basket = dropZone.getAttribute('data-basket');
                    
                    if(letter === basket) {
                        sounds.success();
                        
                        // visually drop inside basket
                        const basketInner = dropZone.querySelector('.basket-container');
                        draggedEl.style.position = 'relative';
                        draggedEl.style.left = '0';
                        draggedEl.style.top = '0';
                        draggedEl.style.transform = 'scale(0.6)';
                        draggedEl.style.margin = '-10px'; // pack them tight
                        draggedEl.classList.remove('drag-letter', 'draggable');
                        basketInner.appendChild(draggedEl);

                        levelState.sorted++;
                        if(levelState.sorted >= levelState.required && !levelState.done) {
                            levelState.done = true;
                            setTimeout(() => showFeedback("Super Sorting!"), 1000);
                        }
                        return true;
                    } else {
                        sounds.error();
                        speak("Oops! That goes in the other basket.");
                        return false;
                    }
                });
            });
        }

        function renderChallenge() {
            levelState = { found: 0, required: 6, done: false };
            
            let targets = ['G', 'G', 'G', 'g', 'g', 'g'];
            let distractors = ['C', 'o', 'Q', 'c', 'O', 'q'];
            let apples = [...targets, ...distractors].sort(() => Math.random() - 0.5);

            // Fixed positions for 12 apples to look like a nice organic tree
            const positions = [
                {x: 25, y: 25}, {x: 50, y: 15}, {x: 75, y: 25},
                {x: 35, y: 40}, {x: 65, y: 40},
                {x: 15, y: 55}, {x: 50, y: 65}, {x: 85, y: 55},
                {x: 30, y: 75}, {x: 70, y: 75},
                {x: 50, y: 40}, {x: 50, y: 85} 
            ];

            board.innerHTML = `
                <div class="flex flex-col items-center w-full max-w-4xl h-full pb-8">
                    <h2 class="text-xl md:text-3xl font-bold text-slate-700 mb-4 text-center bg-white px-6 py-3 rounded-full shadow-sm z-20 border-2 border-green-400">
                        Pick the <span class="font-letter text-sky-600">G</span> and <span class="font-letter text-pink-600">g</span> apples!
                    </h2>
                    
                    <div class="relative w-full max-w-sm flex-1 flex flex-col items-center mt-2">
                        <!-- Tree Top -->
                        <div class="w-64 h-64 md:w-80 md:h-80 bg-green-500 rounded-[40%_60%_70%_30%/40%_50%_60%_50%] relative shadow-xl z-10 border-4 border-green-600 animate-float">
                            ${apples.map((letter, i) => `
                                <div class="apple-btn absolute w-12 h-12 md:w-14 md:h-14 bg-red-500 rounded-full shadow-md flex items-center justify-center text-white font-bold text-3xl font-letter cursor-pointer border-b-4 border-red-700 transition-all duration-300"
                                     style="left: ${positions[i].x}%; top: ${positions[i].y}%; margin-left: -24px; margin-top: -24px;"
                                     data-letter="${letter}">
                                    ${letter}
                                    <!-- Cute Leaf -->
                                    <div class="absolute -top-2 -right-1 w-4 h-4 bg-green-300 rounded-tl-full rounded-br-full shadow-sm"></div>
                                </div>
                            `).join('')}
                        </div>
                        <!-- Trunk -->
                        <div class="w-16 h-32 md:w-20 md:h-40 bg-amber-700 rounded-t-lg -mt-8 shadow-inner z-0 border-x-4 border-amber-900 relative">
                             <div class="absolute inset-0 opacity-20 bg-[repeating-linear-gradient(90deg,transparent,transparent_4px,#000_4px,#000_8px)]"></div>
                        </div>
                    </div>
                </div>
            `;

            speak("Pick the apples with Capital G and Small g!");

            document.querySelectorAll('.apple-btn').forEach(el => {
                el.onclick = function() {
                    if(this.classList.contains('picked')) return;

                    const l = this.getAttribute('data-letter');
                    if(l === 'G' || l === 'g') {
                        sounds.pop();
                        this.classList.add('picked');
                        
                        // Animate falling down and fading
                        this.style.transform = 'translateY(150px) scale(0)';
                        this.style.opacity = '0';
                        
                        levelState.found++;
                        if(levelState.found >= levelState.required && !levelState.done) {
                            levelState.done = true;
                            setTimeout(() => showNextButton(), 1000);
                            sounds.tada();
                            speak("You picked all the right apples!");
                            for(let i=0; i<15; i++) createConfetti(document.body);
                        }
                    } else {
                        sounds.error();
                        this.style.animation = 'none';
                        void this.offsetWidth;
                        this.style.animation = 'shake 0.4s ease-in-out';
                        speak("Oops! Look for G or g.");
                    }
                };
            });
        }

        function renderOutro() {
            board.innerHTML = `
                <div class="text-center flex flex-col items-center relative w-full">
                    <div class="w-48 h-48 md:w-64 md:h-64 mb-8 text-yellow-400 animate-bounce-in drop-shadow-2xl">
                         <svg fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    </div>
                    <h2 class="text-4xl md:text-6xl font-black text-pink-500 mb-6 drop-shadow-md">You are a Letter G Superstar!</h2>
                    <button onclick="restartGame()" class="game-btn text-white font-bold text-2xl py-4 px-12 rounded-full mt-4 flex items-center gap-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Play Again
                    </button>
                </div>
            `;
            
            sounds.tada();
            speak("Congratulations! You are a Letter G Superstar!");
            
            // Continuous Confetti
            const confInterval = setInterval(() => {
                if(currentLevelIndex === levels.length - 1) {
                    createConfetti(document.body);
                } else {
                    clearInterval(confInterval);
                }
            }, 300);
        }

        // --- Flow Control ---

        function loadLevel(index) {
            hideNextButton();
            currentLevelIndex = index;
            const level = levels[index];
            levelTitle.textContent = level.title;
            updateProgress();
            
            // Ensure audio context is ready after user interaction
            if(audioCtx.state === 'suspended') audioCtx.resume();

            // Clear board and clean up old listeners implicitly
            board.innerHTML = '';
            
            switch(level.id) {
                case 'intro': renderIntro(); break;
                case 'meet': renderMeet(); break;
                case 'find-G': generateGridGame('G', true); break;
                case 'find-g': generateGridGame('g', false); break;
                case 'match': renderMatch(); break;
                case 'sort': renderSort(); break;
                case 'challenge': renderChallenge(); break;
                case 'outro': renderOutro(); break;
            }
        }

        function nextLevel() {
            if (currentLevelIndex < levels.length - 1) {
                loadLevel(currentLevelIndex + 1);
            }
        }

        function restartGame() {
            loadLevel(0);
        }

        // Initialize game on load
        window.onload = () => {
            // Pre-load interaction to enable audio/speech policy
            document.body.addEventListener('pointerdown', () => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
            }, {once: true});
            
            loadLevel(0);
        };

    </script>
</body>
</html>
